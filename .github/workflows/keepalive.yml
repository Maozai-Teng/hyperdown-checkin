# 月度空提交，降低 schedule 因仓库长期无活动被停用的风险。
#
# 【本文件用途】给保活任务加一个「手动触发」按钮，用来立刻验证「Workflow permissions」
# 是否真的设置成功（也就是部署手册第 6 步有没有真正生效）。
# 与仓库里原版的唯一区别：on: 下面多了一行 workflow_dispatch:。
#
# 验证方法：把本文件内容整体替换仓库里的 keepalive.yml 并提交，
# 然后 Actions → Keepalive → Run workflow。
#   跑出绿色对勾 = 写权限已生效，保活没问题。
#   报 403 / permission denied = 写权限没保存成功，回第 6 步重做并点 Save。
name: Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
